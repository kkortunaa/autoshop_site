{% extends 'base.html' %}
{% load static %}

{% block title %}AUTOPARTS — Оформление заказа{% endblock %}

{% block content %}
<main class="c-main">
    <section class="c-container c-space-top">
        {% include 'includes/navbar.html' with in_hero=False %}
    </section>

    <section class="c-container c-space-lg c-space-bottom">
        <div class="c-checkout-layout">
            <article class="c-panel c-panel--glass">
                <h1 class="c-section-title c-section-title--small">ОФОРМЛЕНИЕ ЗАКАЗА</h1>
                <form class="c-form-grid" action="#" method="post">
                    {% csrf_token %}
                    <label class="c-field">
                        <span>ФИО</span>
                        <input type="text" name="full_name" placeholder="Иванов Иван Иванович" required>
                    </label>
                    <label class="c-field">
                        <span>Телефон</span>
                        <input type="tel" name="phone" placeholder="+7 (___) ___-__-__" required>
                    </label>
                    <label class="c-field c-field--full">
                        <span>Адрес</span>
                        <input type="text" name="address" placeholder="Город, улица, дом, квартира" required>
                    </label>

                    <label class="c-field">
                        <span>Доставка</span>
                        <select name="delivery_method">
                            <option>Курьер</option>
                            <option>Пункт выдачи</option>
                            <option>Самовывоз</option>
                        </select>
                    </label>
                    <label class="c-field">
                        <span>Оплата</span>
                        <select name="payment_method">
                            <option>Картой онлайн</option>
                            <option>Наличными при получении</option>
                            <option>Безналичный расчёт</option>
                        </select>
                    </label>

                    <button type="submit" class="c-btn c-btn--solid c-field--full">Подтвердить заказ</button>
                </form>
            </article>

            <aside class="c-panel c-panel--glass c-checkout-summary">
                <h2 class="c-section-title c-section-title--small">ВАШ ЗАКАЗ</h2>
                <div class="c-summary-row"><span>Товаров</span><strong>3</strong></div>
                <div class="c-summary-row"><span>Сумма</span><strong>24 900 ₽</strong></div>
                <div class="c-summary-row"><span>Доставка</span><strong>0 ₽</strong></div>
                <div class="c-summary-row c-summary-row--total"><span>Итого</span><strong>24 900 ₽</strong></div>
            </aside>
        </div>
    </section>
</main>
{% endblock %}
