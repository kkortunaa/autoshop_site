<header>
    <div class="container">
        <a href="{% url 'home' %}" class="logo">
            Автозапчасти
        </a>
        
        <nav class="main-nav">
            <ul>
                <li>
                    <a href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>
                        Главная
                    </a>
                </li>
                <li>
                    <a href="{% url 'catalog' %}" {% if request.resolver_match.url_name == 'catalog' %}class="active"{% endif %}>
                        Каталог
                    </a>
                </li>
                <li>
                    <a href="{% url 'about' %}" {% if request.resolver_match.url_name == 'about' %}class="active"{% endif %}>
                        О нас
                    </a>
                </li>
                <li>
                    <a href="{% url 'contacts' %}" {% if request.resolver_match.url_name == 'contacts' %}class="active"{% endif %}>
                        Контакты
                    </a>
                </li>
                <li>
                    <a href="{% url 'cart' %}" class="cart-link">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span class="cart-count">
                            {% if cart_items_count %}
                                {{ cart_items_count }}
                            {% else %}
                                0
                            {% endif %}
                        </span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>
